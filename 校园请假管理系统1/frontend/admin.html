<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园请假系统 · 管理员</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
}

body {
  background: #e8eef5;
}

.wrap {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.left {
  width: 240px;
  background: linear-gradient(180deg, #3d5268 0%, #2c3e50 100%);
  color: #ecf0f1;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 12px rgba(30, 40, 60, 0.2);
  position: relative;
  z-index: 10;
}

.l-title {
  padding: 28px 20px 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: center;
  background: rgba(0, 0, 0, 0.15);
  color: #dfe7f0;
}

.nav-menu {
  flex: 1;
  padding: 12px 0;
  overflow-y: auto;
}

.menu {
  padding: 14px 24px;
  margin: 4px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-size: 0.95rem;
  font-weight: 500;
  color: #c5d0dc;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.5px;
}

.menu:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

.menu.active {
  background: linear-gradient(135deg, #6d8eb0, #4f6f8a);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(70, 100, 140, 0.4);
}

.exit-menu {
  margin-top: auto;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 16px 24px;
  background: rgba(180, 60, 60, 0.15);
  color: #f5a0a0;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.5px;
  border-radius: 0;
  margin: 0;
}

.exit-menu:hover {
  background: rgba(200, 60, 60, 0.3);
  color: #ffb8b8;
}

.right {
  flex: 1;
  padding: 28px;
  background: #e8eef5;
  overflow-y: auto;
}

.box {
  background: #ffffff;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(60, 80, 110, 0.08);
  border: 1px solid #e3e9f2;
}

.box h3 {
  color: #3d5268;
  margin-bottom: 16px;
  font-size: 1.2rem;
  letter-spacing: 1px;
  padding-bottom: 12px;
  border-bottom: 2px solid #e8eef5;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 0.85rem;
}

td, th {
  border: 1px solid #e8eef5;
  padding: 10px 8px;
  text-align: center;
}

th {
  background: #f0f4fa;
  color: #3d5268;
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.5px;
}

tr:hover {
  background: #fafbfd;
}

button {
  padding: 6px 14px;
  margin: 2px;
  cursor: pointer;
  border-radius: 8px;
  font-size: 0.85rem;
  border: none;
  transition: all 0.2s ease;
  font-weight: 500;
}

.add-btn {
  background: #5b7f9e;
  color: #fff;
  padding: 10px 20px;
  font-size: 0.9rem;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  box-shadow: 0 3px 8px rgba(70, 100, 140, 0.25);
}

.add-btn:hover {
  background: #4f6f8a;
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(70, 100, 140, 0.35);
}

.edit-btn {
  background: #8fa4bc;
  color: #fff;
}

.edit-btn:hover {
  background: #7b93ae;
}

.del-btn {
  background: #c97a7a;
  color: #fff;
}

.del-btn:hover {
  background: #b55a5a;
}

.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}

.status-pending {
  background: #fff8e6;
  color: #b8860b;
  border: 1px solid #f0d880;
}

.status-approved {
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}

.status-rejected {
  background: #fde8e8;
  color: #c62828;
  border: 1px solid #f0b0b0;
}

.stat-cards {
  display: flex;
  gap: 20px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.stat-card {
  flex: 1;
  min-width: 120px;
  background: linear-gradient(135deg, #f4f8fe, #e8eef5);
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  border: 1px solid #dce3ef;
}

.stat-card .number {
  font-size: 2rem;
  font-weight: 700;
  color: #3d5268;
}

.stat-card .label {
  color: #6b7d8f;
  margin-top: 6px;
  font-size: 0.85rem;
}

.stat-card .sub {
  color: #8fa4bc;
  font-size: 0.75rem;
  margin-top: 4px;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(30, 40, 60, 0.45);
  backdrop-filter: blur(3px);
  z-index: 200;
  justify-content: center;
  align-items: center;
}

.modal-overlay.active {
  display: flex;
}

.modal-box {
  background: #ffffff;
  border-radius: 18px;
  padding: 32px 28px 28px;
  width: 440px;
  max-width: 90%;
  box-shadow: 0 20px 40px rgba(50, 70, 100, 0.35);
  position: relative;
}

.modal-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #3d5268;
  text-align: center;
  margin-bottom: 24px;
  letter-spacing: 1px;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 18px;
  background: none;
  border: none;
  font-size: 1.6rem;
  color: #8fa4bc;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}

.modal-close:hover {
  color: #4a5568;
}

.form-item {
  margin-bottom: 18px;
}

.form-item label {
  display: block;
  font-size: 0.9rem;
  font-weight: 600;
  color: #4a5568;
  margin-bottom: 6px;
}

.form-item input, .form-item select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #dce3ef;
  border-radius: 10px;
  font-size: 0.9rem;
  background: #f8fafd;
  color: #2c3e4e;
  outline: none;
  transition: 0.2s;
}

.form-item input:focus, .form-item select:focus {
  border-color: #6d8eb0;
  box-shadow: 0 0 0 3px rgba(90, 120, 160, 0.12);
}

.modal-submit {
  width: 100%;
  padding: 12px;
  background: #5b7f9e;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  letter-spacing: 1px;
  transition: 0.2s;
}

.modal-submit:hover {
  background: #4f6f8a;
}

.logout-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(20, 10, 10, 0.4);
  backdrop-filter: blur(3px);
  z-index: 300;
  justify-content: center;
  align-items: center;
}

.logout-overlay.active {
  display: flex;
}

.logout-dialog {
  background: #fff5f5;
  border-radius: 20px;
  padding: 36px 32px 28px;
  width: 380px;
  max-width: 90%;
  box-shadow: 0 20px 50px rgba(80, 20, 20, 0.25);
  text-align: center;
  border: 1px solid #f0d0d0;
}

.logout-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 18px;
  background: #fce8e8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  color: #c45555;
}

.logout-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #5c3030;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.logout-message {
  color: #8b5e5e;
  font-size: 0.9rem;
  margin-bottom: 28px;
  line-height: 1.5;
}

.logout-buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
}

.logout-btn-cancel {
  padding: 10px 28px;
  background: #f0e0e0;
  color: #6b4040;
  border: 1px solid #e0c8c8;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.logout-btn-cancel:hover {
  background: #e8d4d4;
  color: #4a2828;
}

.logout-btn-confirm {
  padding: 10px 28px;
  background: linear-gradient(180deg, #c45555, #a83e3e);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(160, 50, 50, 0.3);
}

.logout-btn-confirm:hover {
  background: linear-gradient(180deg, #d46565, #b84848);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(160, 50, 50, 0.4);
}

@media (max-width: 768px) {
  .left { width: 200px; }
  .right { padding: 16px; }
  .box { padding: 18px; }
  table { font-size: 0.75rem; }
  td, th { padding: 6px 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="l-title">🔧 系统管理员</div>
    <div class="nav-menu">
      <div class="menu active" onclick="change(1)"><span>📚</span> 学生管理</div>
      <div class="menu" onclick="change(2)"><span>👨‍🏫</span> 教师管理</div>
      <div class="menu" onclick="change(3)"><span>📋</span> 请假记录</div>
      <div class="menu" onclick="change(4)"><span>📊</span> 请假统计</div>
      <div class="menu" onclick="change(5)"><span>📝</span> 系统日志</div>
    </div>
    <div class="exit-menu" onclick="showLogoutDialog()"><span>🚪</span> 退出登录</div>
  </div>

  <div class="right">
    <!-- 学生管理 -->
    <div class="box" id="page1">
      <button class="add-btn" onclick="openModal('stu')">＋ 新增学生</button>
      <table><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>手机号</th><th>操作</th></tr></thead><tbody id="adminStu"></tbody></table>
    </div>

    <!-- 教师管理 -->
    <div class="box" id="page2" style="display:none;">
      <button class="add-btn" onclick="openModal('tea')">＋ 新增教师</button>
      <table><thead><tr><th>工号</th><th>姓名</th><th>带班</th><th>电话</th><th>操作</th></tr></thead><tbody id="adminTea"></tbody></table>
    </div>

    <!-- 请假记录 -->
    <div class="box" id="page3" style="display:none;">
      <h3>📋 全系统请假记录</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>请假学生</th><th>请假类型</th>
            <th>开始时间</th><th>结束时间</th>
            <th>原因</th><th>状态</th>
            <th>审批教师</th><th>审批时间</th>
          </tr>
        </thead>
        <tbody id="allLeaves"></tbody>
      </table>
    </div>

    <!-- 请假统计 -->
    <div class="box" id="page4" style="display:none;">
      <h3>📊 全系统请假统计</h3>
      <div class="stat-cards">
        <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">总申请</div></div>
        <div class="stat-card"><div class="number" id="statApproved">0</div><div class="label">已通过</div><div class="sub" id="statApprovedPercent"></div></div>
        <div class="stat-card"><div class="number" id="statRejected">0</div><div class="label">已驳回</div><div class="sub" id="statRejectedPercent"></div></div>
        <div class="stat-card"><div class="number" id="statPending">0</div><div class="label">待审批</div></div>
      </div>
      <div class="stat-cards">
        <div class="stat-card"><div class="number" id="statSick">0</div><div class="label">病假</div></div>
        <div class="stat-card"><div class="number" id="statPersonal">0</div><div class="label">事假</div></div>
        <div class="stat-card"><div class="number" id="statOther">0</div><div class="label">其他</div></div>
      </div>
    </div>

    <!-- 系统日志 -->
    <div class="box" id="page5" style="display:none;">
      <h3>📝 系统操作日志</h3>
      <table><thead><tr><th>序号</th><th>操作人</th><th>操作内容</th><th>IP地址</th><th>时间</th></tr></thead><tbody id="logBox"></tbody></table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle">新增</div>
    <div id="modalContent"></div>
    <button class="modal-submit" onclick="submitForm()">确认提交</button>
  </div>
</div>

<div class="logout-overlay" id="logoutOverlay">
  <div class="logout-dialog">
    <div class="logout-icon">⚠️</div>
    <div class="logout-title">确认退出</div>
    <div class="logout-message">您确定要退出登录吗？<br>退出后需要重新登录才能访问系统。</div>
    <div class="logout-buttons">
      <button class="logout-btn-cancel" onclick="hideLogoutDialog()">取消</button>
      <button class="logout-btn-confirm" onclick="confirmLogout()">确认退出</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';
let cur = 1;
let currentType = '';
let currentIndex = -1;
let stu = [], tea = [], logs = [], allLeaves = [];

// ========== 加载数据 ==========
async function loadUsers(role) {
  try {
    const res = await fetch(API + '/admin/users?role=' + role, { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) return data.data;
    if (data.code === 401) location.href = 'login.html';
  } catch (e) { console.error(e); }
  return [];
}

async function loadAllLeaves() {
  try {
    const res = await fetch(API + '/admin/all-leaves', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      allLeaves = data.data;
      renderAllLeaves();
    }
  } catch (e) { console.error(e); }
}

async function loadStatistics() {
  try {
    const res = await fetch(API + '/admin/statistics', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      const d = data.data;
      document.getElementById('statTotal').textContent = d.total || 0;
      document.getElementById('statApproved').textContent = d.approved || 0;
      document.getElementById('statRejected').textContent = d.rejected || 0;
      document.getElementById('statPending').textContent = d.pending || 0;
      document.getElementById('statSick').textContent = d.sick_leave || 0;
      document.getElementById('statPersonal').textContent = d.personal_leave || 0;
      document.getElementById('statOther').textContent = d.other_leave || 0;

      const total = d.total || 1;
      document.getElementById('statApprovedPercent').textContent = ((d.approved||0)/total*100).toFixed(1) + '%';
      document.getElementById('statRejectedPercent').textContent = ((d.rejected||0)/total*100).toFixed(1) + '%';
    }
  } catch (e) { console.error(e); }
}

async function loadLogs() {
  try {
    const res = await fetch(API + '/admin/logs', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      logs = data.data;
      renderLogs();
    }
  } catch (e) { console.error(e); }
}

// ========== 渲染 ==========
function renderStu() {
  let h = '';
  stu.forEach((v, i) => {
    h += `<tr><td>${v.user_id}</td><td>${v.name}</td><td>${v.class_id||'-'}</td><td>${v.phone||'-'}</td>
      <td><button class="edit-btn" onclick="openModal('stu',${i})">编辑</button>
      <button class="del-btn" onclick="delUser('${v.user_id}','stu')">删除</button></td></tr>`;
  });
  document.getElementById('adminStu').innerHTML = h || '<tr><td colspan="5" style="color:#aaa;">暂无数据</td></tr>';
}

function renderTea() {
  let h = '';
  tea.forEach((v, i) => {
    h += `<tr><td>${v.user_id}</td><td>${v.name}</td><td>${v.class_id||'-'}</td><td>${v.phone||'-'}</td>
      <td><button class="edit-btn" onclick="openModal('tea',${i})">编辑</button>
      <button class="del-btn" onclick="delUser('${v.user_id}','tea')">删除</button></td></tr>`;
  });
  document.getElementById('adminTea').innerHTML = h || '<tr><td colspan="5" style="color:#aaa;">暂无数据</td></tr>';
}

function renderAllLeaves() {
  let h = '';
  if (allLeaves.length === 0) {
    h = '<tr><td colspan="9" style="color:#aaa;">暂无请假记录</td></tr>';
  } else {
    allLeaves.forEach((v, i) => {
      let statusClass = v.status === '待审批' ? 'status-pending' : v.status === '已通过' ? 'status-approved' : 'status-rejected';
      let startD = v.start_time ? v.start_time.substring(0, 16) : '-';
      let endD = v.end_time ? v.end_time.substring(0, 16) : '-';
      let auditTime = v.audit_time ? v.audit_time.substring(0, 16) : '-';
      h += `<tr>
        <td>${i+1}</td>
        <td><strong>${v.student_name||'-'}</strong></td>
        <td>${v.leave_type||'-'}</td>
        <td>${startD}</td>
        <td>${endD}</td>
        <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${v.reason||''}">${v.reason||'-'}</td>
        <td><span class="status-badge ${statusClass}">${v.status||'-'}</span></td>
        <td>${v.teacher_name||'未审批'}</td>
        <td>${auditTime}</td>
      </tr>`;
    });
  }
  document.getElementById('allLeaves').innerHTML = h;
}

function renderLogs() {
  let h = '';
  if (logs.length === 0) {
    h = '<tr><td colspan="5" style="color:#aaa;">暂无日志</td></tr>';
  } else {
    logs.forEach((v, i) => {
      let time = v.create_time ? v.create_time.substring(0, 16) : '-';
      h += `<tr><td>${i+1}</td><td>${v.username||'-'}</td><td>${v.action}</td><td>${v.ip_address||'-'}</td><td>${time}</td></tr>`;
    });
  }
  document.getElementById('logBox').innerHTML = h;
}

// ========== 页面切换 ==========
function change(n) {
  cur = n;
  document.querySelectorAll('.nav-menu .menu').forEach((v, i) => v.className = 'menu' + ((i+1)===n?' active':''));
  for (let i = 1; i <= 5; i++) document.getElementById('page' + i).style.display = (i===n)?'block':'none';
  if (n === 1) loadUsers('stu').then(d => { stu = d; renderStu(); });
  if (n === 2) loadUsers('tea').then(d => { tea = d; renderTea(); });
  if (n === 3) loadAllLeaves();
  if (n === 4) loadStatistics();
  if (n === 5) loadLogs();
}

// ========== 删除 ==========
async function delUser(id, role) {
  if (!confirm('确认删除吗？')) return;
  const res = await fetch(API + '/admin/user/' + id, { method: 'DELETE', credentials: 'include' });
  const data = await res.json();
  if (data.code === 200) {
    alert('删除成功');
    if (role === 'stu') loadUsers('stu').then(d => { stu = d; renderStu(); });
    else loadUsers('tea').then(d => { tea = d; renderTea(); });
  } else alert(data.msg);
}

// ========== 弹窗 ==========
function openModal(type, index) {
  currentType = type;
  currentIndex = (index !== undefined) ? index : -1;
  const titles = { stu: '学生', tea: '教师' };
  document.getElementById('modalTitle').textContent = (currentIndex >= 0 ? '编辑' : '新增') + titles[type];
  let html = '';
  if (type === 'stu') {
    const item = currentIndex >= 0 ? stu[currentIndex] : { user_id: '', name: '', class_id: '', phone: '' };
    html = `<div class="form-item"><label>学号</label><input id="fId" value="${item.user_id}" placeholder="请输入学号"></div>
      <div class="form-item"><label>姓名</label><input id="fName" value="${item.name}" placeholder="请输入姓名"></div>
      <div class="form-item"><label>班级</label><input id="fCls" value="${item.class_id||''}" placeholder="请输入班级"></div>
      <div class="form-item"><label>手机号</label><input id="fPhone" value="${item.phone||''}" placeholder="请输入手机号"></div>`;
  } else if (type === 'tea') {
    const item = currentIndex >= 0 ? tea[currentIndex] : { user_id: '', name: '', class_id: '', phone: '' };
    html = `<div class="form-item"><label>工号</label><input id="fId" value="${item.user_id}" placeholder="请输入工号"></div>
      <div class="form-item"><label>姓名</label><input id="fName" value="${item.name}" placeholder="请输入姓名"></div>
      <div class="form-item"><label>带班</label><input id="fCls" value="${item.class_id||''}" placeholder="请输入带班班级"></div>
      <div class="form-item"><label>电话</label><input id="fPhone" value="${item.phone||''}" placeholder="请输入电话"></div>`;
  }
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

async function submitForm() {
  const id = document.getElementById('fId')?.value?.trim();
  const name = document.getElementById('fName')?.value?.trim();
  const clsName = document.getElementById('fCls')?.value?.trim();
  const phone = document.getElementById('fPhone')?.value?.trim();
  if (!id || !name) { alert('ID和姓名不能为空'); return; }

  const userData = {
    username: id,
    name: name,
    phone: phone || '',
    role: currentType === 'stu' ? 'stu' : 'tea',
    class_id: clsName || null
  };

  let res;
  if (currentIndex >= 0) {
    const userId = currentType === 'stu' ? stu[currentIndex].user_id : tea[currentIndex].user_id;
    res = await fetch(API + '/admin/user/' + userId, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify(userData)
    });
  } else {
    res = await fetch(API + '/admin/user', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify(userData)
    });
  }

  const data = await res.json();
  if (data.code === 200) {
    alert('操作成功');
    closeModal();
    if (currentType === 'stu') loadUsers('stu').then(d => { stu = d; renderStu(); });
    else loadUsers('tea').then(d => { tea = d; renderTea(); });
  } else {
    alert(data.msg);
  }
}

// ========== 退出 ==========
function showLogoutDialog() { document.getElementById('logoutOverlay').classList.add('active'); }
function hideLogoutDialog() { document.getElementById('logoutOverlay').classList.remove('active'); }
async function confirmLogout() {
  await fetch(API + '/logout', { method: 'POST', credentials: 'include' });
  localStorage.clear();
  location.href = 'login.html';
}

document.addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
  if (e.target === document.getElementById('logoutOverlay')) hideLogoutDialog();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('logoutOverlay').classList.contains('active')) hideLogoutDialog();
    else if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
  }
});

// ========== 初始化 ==========
loadUsers('stu').then(d => { stu = d; renderStu(); });
loadUsers('tea').then(d => { tea = d; renderTea(); });
loadStatistics();
loadLogs();
</script>
</body>
</html>
