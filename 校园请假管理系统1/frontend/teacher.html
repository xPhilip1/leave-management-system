<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园请假系统 · 辅导员后台</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
}

body {
  background: #e8eef5;
}

.wrap {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.left {
  width: 240px;
  background: linear-gradient(180deg, #3d5268 0%, #2c3e50 100%);
  color: #ecf0f1;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 12px rgba(30, 40, 60, 0.2);
  position: relative;
  z-index: 10;
}

.l-title {
  padding: 28px 20px 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: center;
  background: rgba(0, 0, 0, 0.15);
  color: #dfe7f0;
}

.nav-menu {
  flex: 1;
  padding: 12px 0;
  overflow-y: auto;
}

.menu {
  padding: 14px 24px;
  margin: 4px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-size: 0.95rem;
  font-weight: 500;
  color: #c5d0dc;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.5px;
}

.menu:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

.menu.active {
  background: linear-gradient(135deg, #6d8eb0, #4f6f8a);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(70, 100, 140, 0.4);
}

.badge {
  display: inline-block;
  background: #e07474;
  color: #fff;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 12px;
  margin-left: auto;
  font-weight: 600;
  min-width: 20px;
  text-align: center;
}

.exit-menu {
  margin-top: auto;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 16px 24px;
  background: rgba(180, 60, 60, 0.15);
  color: #f5a0a0;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.5px;
  border-radius: 0;
  margin: 0;
}

.exit-menu:hover {
  background: rgba(200, 60, 60, 0.3);
  color: #ffb8b8;
}

.right {
  flex: 1;
  padding: 28px;
  background: #e8eef5;
  overflow-y: auto;
}

.box {
  background: #ffffff;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(60, 80, 110, 0.08);
  border: 1px solid #e3e9f2;
}

.box h3 {
  color: #3d5268;
  margin-bottom: 20px;
  font-size: 1.2rem;
  letter-spacing: 1px;
  padding-bottom: 14px;
  border-bottom: 2px solid #e8eef5;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.9rem;
  font-weight: 600;
  color: #4a5568;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #dce3ef;
  border-radius: 10px;
  font-size: 0.95rem;
  background: #f8fafd;
  color: #2c3e4e;
  outline: none;
  transition: all 0.25s ease;
}

.form-group input:focus {
  border-color: #6d8eb0;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(90, 120, 160, 0.12);
}

.form-group input:disabled {
  background: #f0f4fa;
  color: #8fa4bc;
  cursor: not-allowed;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-top: 8px;
}

td, th {
  border: 1px solid #e8eef5;
  padding: 12px 10px;
  text-align: center;
}

th {
  background: #f0f4fa;
  color: #3d5268;
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.5px;
}

tr:hover {
  background: #fafbfd;
}

.result-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.result-approved {
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}

.result-rejected {
  background: #fde8e8;
  color: #c62828;
  border: 1px solid #f0b0b0;
}

button {
  padding: 8px 18px;
  margin: 2px;
  cursor: pointer;
  border-radius: 8px;
  font-size: 0.85rem;
  border: none;
  transition: all 0.2s ease;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.btn-pass {
  background: #5b9e7d;
  color: #fff;
  box-shadow: 0 3px 8px rgba(70, 140, 100, 0.25);
}

.btn-pass:hover {
  background: #4a8a6a;
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(70, 140, 100, 0.35);
}

.btn-refuse {
  background: #c97a7a;
  color: #fff;
  box-shadow: 0 3px 8px rgba(160, 70, 70, 0.25);
}

.btn-refuse:hover {
  background: #b55a5a;
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(160, 70, 70, 0.35);
}

.btn-primary {
  background: #5b7f9e;
  color: #fff;
  padding: 12px 28px;
  font-size: 0.95rem;
  box-shadow: 0 3px 8px rgba(70, 100, 140, 0.25);
}

.btn-primary:hover {
  background: #4f6f8a;
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(70, 100, 140, 0.35);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 0.8rem;
}

.profile-card {
  background: #f8fafd;
  border-radius: 14px;
  padding: 24px;
  border: 1px solid #e3e9f2;
  margin-bottom: 20px;
}

.profile-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid #e8eef5;
}

.profile-item:last-child {
  border-bottom: none;
}

.profile-label {
  font-size: 0.9rem;
  font-weight: 600;
  color: #4a5568;
  width: 100px;
}

.profile-value {
  flex: 1;
  font-size: 0.95rem;
  color: #2c3e4e;
  padding: 0 16px;
}

.profile-value.masked {
  letter-spacing: 3px;
}

.profile-action {
  min-width: 80px;
  text-align: right;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(30, 40, 60, 0.45);
  backdrop-filter: blur(3px);
  z-index: 200;
  justify-content: center;
  align-items: center;
}

.modal-overlay.active {
  display: flex;
}

.modal-box {
  background: #ffffff;
  border-radius: 18px;
  padding: 32px 28px 28px;
  width: 440px;
  max-width: 90%;
  box-shadow: 0 20px 40px rgba(50, 70, 100, 0.35);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #3d5268;
  text-align: center;
  margin-bottom: 24px;
  letter-spacing: 1px;
  padding-bottom: 14px;
  border-bottom: 2px solid #e8eef5;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 18px;
  background: none;
  border: none;
  font-size: 1.6rem;
  color: #8fa4bc;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}

.modal-close:hover {
  color: #4a5568;
}

.modal-submit {
  width: 100%;
  padding: 12px;
  background: #5b7f9e;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  letter-spacing: 1px;
  transition: 0.2s;
}

.modal-submit:hover {
  background: #4f6f8a;
}

.hint-text {
  font-size: 0.8rem;
  color: #8fa4bc;
  margin-top: 4px;
}

.error-text {
  font-size: 0.8rem;
  color: #c45555;
  margin-top: 4px;
  display: none;
}

.confirm-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(30, 40, 60, 0.45);
  backdrop-filter: blur(3px);
  z-index: 200;
  justify-content: center;
  align-items: center;
}

.confirm-overlay.active {
  display: flex;
}

.confirm-dialog {
  background: #ffffff;
  border-radius: 18px;
  padding: 32px 28px 24px;
  width: 400px;
  max-width: 90%;
  box-shadow: 0 20px 40px rgba(50, 70, 100, 0.35);
  text-align: center;
}

.confirm-dialog.pass-dialog {
  border-top: 4px solid #5b9e7d;
}

.confirm-dialog.refuse-dialog {
  border-top: 4px solid #c97a7a;
}

.confirm-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
}

.confirm-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #3d5268;
  margin-bottom: 8px;
}

.confirm-info {
  color: #6b7d8f;
  font-size: 0.85rem;
  margin-bottom: 8px;
}

.confirm-student {
  font-size: 1rem;
  font-weight: 600;
  color: #2c3e4e;
  margin-bottom: 20px;
}

.confirm-buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
}

.confirm-btn-cancel {
  padding: 10px 28px;
  background: #f0f0f0;
  color: #6b7d8f;
  border: 1px solid #dce3ef;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.confirm-btn-cancel:hover {
  background: #e5e5e5;
}

.confirm-btn-submit {
  padding: 10px 28px;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.confirm-btn-submit.btn-pass-confirm {
  background: linear-gradient(180deg, #5b9e7d, #4a8a6a);
  box-shadow: 0 4px 12px rgba(70, 140, 100, 0.3);
}

.confirm-btn-submit.btn-pass-confirm:hover {
  background: linear-gradient(180deg, #6aaf8e, #559978);
}

.confirm-btn-submit.btn-refuse-confirm {
  background: linear-gradient(180deg, #c97a7a, #b55a5a);
  box-shadow: 0 4px 12px rgba(160, 70, 70, 0.3);
}

.confirm-btn-submit.btn-refuse-confirm:hover {
  background: linear-gradient(180deg, #d48a8a, #c06868);
}

.logout-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(20, 10, 10, 0.4);
  backdrop-filter: blur(3px);
  z-index: 300;
  justify-content: center;
  align-items: center;
}

.logout-overlay.active {
  display: flex;
}

.logout-dialog {
  background: #fff5f5;
  border-radius: 20px;
  padding: 36px 32px 28px;
  width: 380px;
  max-width: 90%;
  box-shadow: 0 20px 50px rgba(80, 20, 20, 0.25);
  text-align: center;
  border: 1px solid #f0d0d0;
}

.logout-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 18px;
  background: #fce8e8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  color: #c45555;
}

.logout-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #5c3030;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.logout-message {
  color: #8b5e5e;
  font-size: 0.9rem;
  margin-bottom: 28px;
  line-height: 1.5;
}

.logout-buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
}

.logout-btn-cancel {
  padding: 10px 28px;
  background: #f0e0e0;
  color: #6b4040;
  border: 1px solid #e0c8c8;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}

.logout-btn-cancel:hover {
  background: #e8d4d4;
  color: #4a2828;
}

.logout-btn-confirm {
  padding: 10px 28px;
  background: linear-gradient(180deg, #c45555, #a83e3e);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(160, 50, 50, 0.3);
}

.logout-btn-confirm:hover {
  background: linear-gradient(180deg, #d46565, #b84848);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(160, 50, 50, 0.4);
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #a0b0c0;
}

.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

@media (max-width: 768px) {
  .left { width: 200px; }
  .right { padding: 16px; }
  .box { padding: 18px; }
  .profile-item { flex-direction: column; align-items: flex-start; gap: 8px; }
  .profile-action { text-align: left; }
  table { font-size: 0.8rem; }
  td, th { padding: 8px 6px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="l-title">👨‍🏫 辅导员后台</div>
    <div class="nav-menu">
      <div class="menu active" onclick="change(1)">
        <span>📋</span> 待审批请假
        <span class="badge" id="waitCount">0</span>
      </div>
      <div class="menu" onclick="change(2)">
        <span>✅</span> 已处理记录
      </div>
      <div class="menu" onclick="change(3)">
        <span>👨‍🎓</span> 班级学生名单
      </div>
      <div class="menu" onclick="change(4)">
        <span>👤</span> 个人资料
      </div>
    </div>
    <div class="exit-menu" onclick="showLogoutDialog()">
      <span>🚪</span> 退出登录
    </div>
  </div>

  <div class="right">
    <div class="box" id="page1">
      <h3>📋 待审批请假列表</h3>
      <table>
        <thead><tr><th>序号</th><th>姓名</th><th>请假时段</th><th>类型</th><th>事由</th><th>操作</th></tr></thead>
        <tbody id="waitList"></tbody>
      </table>
    </div>

    <div class="box" id="page2" style="display:none;">
      <h3>✅ 已审批历史记录</h3>
      <table>
        <thead><tr><th>序号</th><th>姓名</th><th>请假时段</th><th>类型</th><th>事由</th><th>审批结果</th><th>操作时间</th></tr></thead>
        <tbody id="doneList"></tbody>
      </table>
    </div>

    <div class="box" id="page3" style="display:none;">
      <h3>👨‍🎓 本班学生信息</h3>
      <table>
        <thead><tr><th>序号</th><th>学号</th><th>姓名</th><th>手机号</th><th>班级</th></tr></thead>
        <tbody id="stuList"></tbody>
      </table>
    </div>

    <div class="box" id="page4" style="display:none;">
      <h3>👤 个人资料</h3>
      <div class="profile-card">
        <div class="profile-item"><span class="profile-label">工号</span><span class="profile-value" id="profileId">-</span><span class="profile-action"></span></div>
        <div class="profile-item"><span class="profile-label">姓名</span><span class="profile-value" id="profileName">-</span><span class="profile-action"><button class="btn-primary btn-sm" onclick="openEditModal('name')">✏️ 修改</button></span></div>
        <div class="profile-item"><span class="profile-label">联系电话</span><span class="profile-value" id="profilePhone">-</span><span class="profile-action"><button class="btn-primary btn-sm" onclick="openEditModal('phone')">✏️ 修改</button></span></div>
        <div class="profile-item"><span class="profile-label">带班班级</span><span class="profile-value" id="profileClass">-</span><span class="profile-action"></span></div>
        <div class="profile-item"><span class="profile-label">密码</span><span class="profile-value masked">••••••••</span><span class="profile-action"><button class="btn-primary btn-sm" onclick="openEditModal('password')">✏️ 修改</button></span></div>
      </div>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog" id="confirmDialog">
    <div class="confirm-icon" id="confirmIcon"></div>
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-student" id="confirmStudent"></div>
    <div class="confirm-info" id="confirmInfo"></div>
    <div class="confirm-buttons">
      <button class="confirm-btn-cancel" onclick="closeConfirmDialog()">取消</button>
      <button class="confirm-btn-submit" id="confirmSubmitBtn" onclick="executeConfirm()">确认</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeEditModal()">×</button>
    <div class="modal-title" id="modalTitle">修改资料</div>
    <div id="modalContent"></div>
    <button class="modal-submit" onclick="submitEdit()">确认修改</button>
  </div>
</div>

<div class="logout-overlay" id="logoutOverlay">
  <div class="logout-dialog">
    <div class="logout-icon">⚠️</div>
    <div class="logout-title">确认退出</div>
    <div class="logout-message">您确定要退出登录吗？<br>退出后需要重新登录才能访问系统。</div>
    <div class="logout-buttons">
      <button class="logout-btn-cancel" onclick="hideLogoutDialog()">取消</button>
      <button class="logout-btn-confirm" onclick="confirmLogout()">确认退出</button>
    </div>
  </div>
</div>

<script>
let curPage = 1;
let waitAudit = [];
let doneAudit = [];
let studentArr = [];
let pendingAction = null;
let pendingIndex = -1;
let currentEditType = '';
let userInfo = {};

const API = 'http://localhost:5000/api';

// ========== 加载用户信息 ==========
function loadUserInfo() {
  const stored = localStorage.getItem('userInfo');
  if (stored) {
    userInfo = JSON.parse(stored);
    document.getElementById('profileId').textContent = userInfo.user_id || '-';
    document.getElementById('profileName').textContent = userInfo.name || '-';
    document.getElementById('profileClass').textContent = userInfo.class_id || '-';
    const phone = userInfo.phone || '';
    document.getElementById('profilePhone').textContent = phone.length === 11 ? phone.substring(0,3)+'****'+phone.substring(7) : (phone || '-');
  }
}

// ========== 加载待审批 ==========
async function loadPendingFromDB() {
  try {
    const res = await fetch(API + '/teacher/pending', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      waitAudit = data.data;
      renderWait();
    } else if (data.code === 401) {
      location.href = 'login.html';
    }
  } catch (e) { console.error(e); }
}

// ========== 加载已处理 ==========
async function loadDoneFromDB() {
  try {
    const res = await fetch(API + '/teacher/done', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      doneAudit = data.data;
      renderDone();
    } else if (data.code === 401) {
      location.href = 'login.html';
    }
  } catch (e) { console.error(e); }
}

// ========== 加载学生名单 ==========
async function loadStudentsFromDB() {
  try {
    const res = await fetch(API + '/teacher/students', { credentials: 'include' });
    const data = await res.json();
    if (data.code === 200) {
      studentArr = data.data;
      renderStu();
    }
  } catch (e) { console.error(e); }
}

// ========== 渲染 ==========
function renderWait() {
  let html = '';
  if (waitAudit.length === 0) {
    html = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><div>暂无待审批请假</div></div></td></tr>`;
  } else {
    waitAudit.forEach((item, idx) => {
      let startD = item.start_time ? item.start_time.substring(0, 16) : '';
      let endD = item.end_time ? item.end_time.substring(0, 16) : '';
      html += `<tr>
        <td>${idx + 1}</td>
        <td><strong>${item.student_name || '-'}</strong></td>
        <td>${startD} ~ ${endD}</td>
        <td>${item.leave_type}</td>
        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${item.reason||''}">${item.reason||'-'}</td>
        <td>
          <button class="btn-pass btn-sm" onclick="confirmAction('pass', ${idx})">✓ 通过</button>
          <button class="btn-refuse btn-sm" onclick="confirmAction('refuse', ${idx})">✗ 驳回</button>
        </td>
      </tr>`;
    });
  }
  document.getElementById('waitList').innerHTML = html;
  document.getElementById('waitCount').textContent = waitAudit.length;
}

function renderDone() {
  let html = '';
  if (doneAudit.length === 0) {
    html = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div><div>暂无处理记录</div></div></td></tr>`;
  } else {
    doneAudit.forEach((item, idx) => {
      const resultClass = item.status === '已通过' ? 'result-approved' : 'result-rejected';
      let startD = item.start_time ? item.start_time.substring(0, 16) : '';
      let endD = item.end_time ? item.end_time.substring(0, 16) : '';
      let auditTime = item.audit_time ? item.audit_time.substring(0, 16) : '-';
      html += `<tr>
        <td>${idx + 1}</td>
        <td>${item.student_name || '-'}</td>
        <td>${startD} ~ ${endD}</td>
        <td>${item.leave_type}</td>
        <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${item.reason||''}">${item.reason||'-'}</td>
        <td><span class="result-badge ${resultClass}">${item.status}</span></td>
        <td style="font-size:0.8rem;color:#8fa4bc;">${auditTime}</td>
      </tr>`;
    });
  }
  document.getElementById('doneList').innerHTML = html;
}

function renderStu() {
  let html = '';
  if (studentArr.length === 0) {
    html = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📭</div><div>暂无学生数据</div></div></td></tr>`;
  } else {
    studentArr.forEach((item, idx) => {
      html += `<tr><td>${idx + 1}</td><td>${item.user_id}</td><td>${item.name}</td><td>${item.phone||'-'}</td><td>${item.class_id||'-'}</td></tr>`;
    });
  }
  document.getElementById('stuList').innerHTML = html;
}

// ========== 页面切换 ==========
function change(n) {
  curPage = n;
  document.querySelectorAll('.nav-menu .menu').forEach((v, i) => v.className = 'menu' + ((i+1)===n?' active':''));
  document.getElementById('page1').style.display = n===1?'block':'none';
  document.getElementById('page2').style.display = n===2?'block':'none';
  document.getElementById('page3').style.display = n===3?'block':'none';
  document.getElementById('page4').style.display = n===4?'block':'none';
  if (n === 2) loadDoneFromDB();
  if (n === 3) loadStudentsFromDB();
  if (n === 4) loadUserInfo();
}

// ========== 审批 ==========
function confirmAction(action, idx) {
  pendingAction = action;
  pendingIndex = idx;
  const item = waitAudit[idx];
  const dialog = document.getElementById('confirmDialog');
  dialog.className = 'confirm-dialog ' + (action === 'pass' ? 'pass-dialog' : 'refuse-dialog');
  document.getElementById('confirmIcon').textContent = action === 'pass' ? '✅' : '❌';
  document.getElementById('confirmTitle').textContent = action === 'pass' ? '确认通过审批' : '确认驳回申请';
  document.getElementById('confirmStudent').textContent = `${item.student_name} - ${item.leave_type}`;
  let startD = item.start_time ? item.start_time.substring(0, 16) : '';
  let endD = item.end_time ? item.end_time.substring(0, 16) : '';
  document.getElementById('confirmInfo').textContent = `${startD} ~ ${endD} | ${item.reason||''}`;
  const btn = document.getElementById('confirmSubmitBtn');
  btn.className = 'confirm-btn-submit ' + (action === 'pass' ? 'btn-pass-confirm' : 'btn-refuse-confirm');
  btn.textContent = action === 'pass' ? '确认通过' : '确认驳回';
  document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirmDialog() {
  document.getElementById('confirmOverlay').classList.remove('active');
  pendingAction = null;
  pendingIndex = -1;
}

async function executeConfirm() {
  if (pendingAction === null || pendingIndex < 0) return;
  const leaveId = waitAudit[pendingIndex].leave_id;
  try {
    const res = await fetch(API + `/teacher/audit/${leaveId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ action: pendingAction })
    });
    const data = await res.json();
    if (data.code === 200) {
      alert(data.msg);
      loadPendingFromDB();
      loadDoneFromDB();
    } else {
      alert(data.msg);
    }
  } catch (e) { alert('操作失败'); }
  closeConfirmDialog();
}

// ========== 修改资料 ==========
function openEditModal(type) {
  currentEditType = type;
  const titles = { name: '修改姓名', phone: '修改联系电话', password: '修改密码' };
  document.getElementById('modalTitle').textContent = titles[type];
  let html = '';
  if (type === 'name') {
    html = `<div class="form-group"><label>新姓名 <span style="color:#c45555;">*</span></label><input id="editNewName" value="${userInfo.name||''}"><div class="hint-text">修改姓名无需验证密码</div></div>`;
  } else if (type === 'phone') {
    html = `<div class="form-group"><label>新手机号 <span style="color:#c45555;">*</span></label><input id="editNewPhone" value="${userInfo.phone||''}"><div class="hint-text">修改手机号需要验证原密码</div></div>
      <div class="form-group"><label>原密码确认 <span style="color:#c45555;">*</span></label><input id="editOldPwd" type="password"><div class="error-text" id="pwdError">原密码错误</div></div>`;
  } else {
    html = `<div class="form-group"><label>原密码 <span style="color:#c45555;">*</span></label><input id="editOldPwd" type="password"><div class="error-text" id="pwdError">原密码错误</div></div>
      <div class="form-group"><label>新密码 <span style="color:#c45555;">*</span></label><input id="editNewPwd" type="password"><div class="hint-text">密码长度至少4位</div></div>
      <div class="form-group"><label>确认新密码 <span style="color:#c45555;">*</span></label><input id="editConfirmPwd" type="password"><div class="error-text" id="confirmError">两次密码不一致</div></div>`;
  }
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() { document.getElementById('editModal').classList.remove('active'); currentEditType = ''; }

async function submitEdit() {
  const btn = document.querySelector('.modal-submit');
  if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }
  try {
  if (currentEditType === 'name') {
    const n = document.getElementById('editNewName')?.value?.trim();
    if (!n) { alert('请输入新姓名'); return; }
    const res = await fetch(API + '/user/profile', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ name: n })
    });
    const data = await res.json();
    if (data.code === 200) { userInfo.name = n; localStorage.setItem('userInfo', JSON.stringify(userInfo)); loadUserInfo(); alert('修改成功'); closeEditModal(); }
    else alert(data.msg);
  } else if (currentEditType === 'phone') {
    const p = document.getElementById('editNewPhone')?.value?.trim();
    const o = document.getElementById('editOldPwd')?.value;
    if (!p) { alert('请输入新手机号'); return; }
    if (!/^1\d{10}$/.test(p)) { alert('请输入正确的手机号格式'); return; }
    if (!o) { alert('请输入原密码'); return; }
    const res = await fetch(API + '/user/profile', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ phone: p, old_password: o })
    });
    const data = await res.json();
    if (data.code === 200) { userInfo.phone = p; localStorage.setItem('userInfo', JSON.stringify(userInfo)); loadUserInfo(); alert('修改成功'); closeEditModal(); }
    else { document.getElementById('pwdError').style.display = 'block'; }
  } else {
    const o = document.getElementById('editOldPwd')?.value;
    const n = document.getElementById('editNewPwd')?.value;
    const c = document.getElementById('editConfirmPwd')?.value;
    if (!o || !n || !c) { alert('请填写所有字段'); return; }
    if (n.length < 4) { alert('新密码长度至少4位'); return; }
    if (n !== c) { document.getElementById('confirmError').style.display = 'block'; return; }
    const res = await fetch(API + '/user/profile', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ new_password: n, old_password: o })
    });
    const data = await res.json();
    if (data.code === 200) { alert('密码修改成功！请重新登录'); closeEditModal(); }
    else { document.getElementById('pwdError').style.display = 'block'; }
  }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '确认修改'; }
  }
}

// ========== 退出 ==========
function showLogoutDialog() { document.getElementById('logoutOverlay').classList.add('active'); }
function hideLogoutDialog() { document.getElementById('logoutOverlay').classList.remove('active'); }
async function confirmLogout() {
  await fetch(API + '/logout', { method: 'POST', credentials: 'include' });
  localStorage.clear();
  location.href = 'login.html';
}

document.addEventListener('click', (e) => {
  if (e.target === document.getElementById('editModal')) closeEditModal();
  if (e.target === document.getElementById('logoutOverlay')) hideLogoutDialog();
  if (e.target === document.getElementById('confirmOverlay')) closeConfirmDialog();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('logoutOverlay').classList.contains('active')) hideLogoutDialog();
    else if (document.getElementById('confirmOverlay').classList.contains('active')) closeConfirmDialog();
    else if (document.getElementById('editModal').classList.contains('active')) closeEditModal();
  }
});

// ========== 初始化 ==========
loadUserInfo();
loadPendingFromDB();
loadDoneFromDB();
</script>
